{% extends "base.html" %}
{% block title %}Admin login · QP Leak Detector{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <div class="card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="icon-circle mx-auto mb-3"><i class="bi bi-person-lock"></i></div>
        <h1 class="h4 text-center mb-1">Admin login</h1>
        <p class="text-center text-secondary small mb-4">Only the exam administrator can create copies.</p>

        <form method="post" onsubmit="startLoading(this)">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control form-control-lg" id="username" name="username"
                   autocomplete="username" required autofocus>
          </div>

          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <div class="input-group input-group-lg">
              <input class="form-control" id="password" name="password" type="password"
                     autocomplete="current-password" required>
              <button class="btn btn-outline-secondary" type="button"
                      data-toggle-password="password" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button class="btn btn-primary btn-lg w-100" type="submit" data-loading-text="Logging in...">
            Log in
          </button>
        </form>
      </div>
    </div>

    <p class="text-center small text-secondary mt-3">
      Just want to check a leaked paper?
      <a href="{{ url_for('verify') }}">Verify without logging in</a>
    </p>
  </div>
</div>
{% endblock %}
